
name: Build JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -20
          ls -la

      - name: Verificar Gradle
        run: |
          find . -maxdepth 5 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
