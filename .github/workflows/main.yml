
name: Build JARVIS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Verificar arquivos Gradle
        run: |
          echo "Arquivos na raiz:"
          ls -la
          echo "Arquivos Gradle encontrados:"
          find . -maxdepth 4 \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
          arguments: assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
